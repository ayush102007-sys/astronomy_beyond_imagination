{% extends "base.html" %}

{% block title %}Universe Gallery{% endblock %}

{% block content %}
<main>
    <div class="list">
        <div id="gallery">
            <center><h2>The Cosmic Gallery</h2></center>
        </div>
        <div class="search">
            <form action="/images" method="post">

                <label for="object"></label>
                <input type="text" name="object" id="object" placeholder="Search for objects...">
                <input type="submit" value="Search" id="submit">

            </form>
        </div>
        {% for obj, image_url in lst %}
           <div class="box{{ loop.index }}">
                <a href="{{ url_for('info', alt_text=obj|lower, image_url=image_url) }}" class="image-box">
                    <img src="{{ image_url }}" >
                </a>
           </div>          
        {% endfor %}
        
    </div>
</main>
{% endblock %}
