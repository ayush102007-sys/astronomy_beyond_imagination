{% extends "base.html" %}

{% block title %}Universe Gallery{% endblock %}

            <center><h2>The Cosmic Gallery</h2></center>

        </div>
        <div class="box5">
            <a href="{{ url_for('gallery', alt_text= 'uranus') }}" class="image-box">
                <img src="/static/images/uranus.jpg" >
            </a>
        </div>

            <a href="{{ url_for('gallery', alt_text= 'neptune') }}" class="image-box">
