{% extends "base.html" %}

{% block title %}Universe Gallery{% endblock %}

{% block content %}
<main>
    <div class="list">
        <div id="gallery">
            <center><h2>The Cosmic Gallery</h2></center>
        </div>
        <div class="search">
            <form action=
            "{{ url_for('gallery', cat_text= '') }}" method="post">

                <label for="object"></label>
                <input type="text" name="object" id="object" placeholder="Search for objects...">
                <input type="submit" value="Search" id="submit">

            </form>
        </div>

        <div class="category">
            <div class="cat1">
                <a href="{{ url_for('gallery', cat_text= 'planet', idx=0) }}" class="cat">Planets</a>

                <a href="{{ url_for('gallery', cat_text= 'star', idx=1) }}" class="cat">Stars</a>
            </div>

            <div class="cat2">
                <a href=
            "{{ url_for('gallery', cat_text= 'galaxy', idx= 2) }}" class="cat">Galaxies</a>
            <a href=
            "{{ url_for('gallery', cat_text= 'nebulae', idx= 3) }}" class="cat">Nebulaes</a>
            </div>

        </div>

        <div class="gallery-grid">
            {% for obj, image_url in lst %}
           <div class="box{{ loop.index }}">
                <a href="{{ url_for('info', alt_text=obj|lower, image_url=image_url) }}" class="image-box">
                    <img src="{{ image_url }}" alt="{{ obj }}">
                </a>
           </div>          
        {% endfor %}
        </div>
        
        
    </div>
</main>
{% endblock %}
